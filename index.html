<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcam Canvas Shooter</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

  <!-- Header -->
  <header class="w-full max-w-4xl flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
    <div class="flex items-center gap-3">
      <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
        <i class="fa-solid fa-camera-retro text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">Webcam Canvas Shooter</h1>
        <p class="text-xs text-slate-400">バックグラウンドカメラ＆Canvas高効率キャプチャ</p>
      </div>
    </div>
    
    <!-- Camera Active Indicator -->
    <div id="status-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 text-xs font-medium border border-slate-700 transition-all duration-300">
      <span class="w-2.5 h-2.5 rounded-full bg-slate-500 transition-colors" id="status-dot"></span>
      <span id="status-text">カメラ停止中</span>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="w-full max-w-4xl flex-1 flex flex-col lg:flex-row gap-6">

    <!-- Control Panel -->
    <section class="w-full lg:w-1/3 flex flex-col gap-6 bg-slate-800/60 p-6 rounded-2xl border border-slate-700/60 backdrop-blur-sm">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 border-b border-slate-700/50 pb-2">コントロール設定</h2>

      <!-- Camera Facing Mode Selector -->
      <div class="flex flex-col gap-1.5 p-3.5 bg-slate-900/60 rounded-xl border border-slate-700/40">
        <label for="camera-select" class="text-sm font-medium text-slate-200 flex items-center justify-between">
          <span>カメラ切り替え</span>
          <i class="fa-solid fa-arrows-rotate text-xs text-slate-400"></i>
        </label>
        <select id="camera-select" class="w-full mt-1 bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="user">インカメラ (前面)</option>
          <option value="environment" selected>アウトカメラ (背面)</option>
        </select>
      </div>

      <!-- Continuous Mode Toggle Switch -->
      <div class="flex items-center justify-between p-3.5 bg-slate-900/60 rounded-xl border border-slate-700/40">
        <div class="flex flex-col pr-2">
          <span class="text-sm font-medium text-slate-200">連写モード (待機)</span>
          <span class="text-xs text-slate-400">常時オンで即時撮影 / 省電力OFF</span>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="mode-toggle" class="sr-only peer">
          <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
        </label>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col gap-3">
        <!-- Shutter Button -->
        <button id="snap-btn" class="w-full py-4 px-6 rounded-xl font-semibold text-white bg-gradient-to-r from-indigo-500 via-indigo-600 to-purple-600 hover:from-indigo-600 hover:to-purple-700 active:scale-[0.98] transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-3">
          <i class="fa-solid fa-aperture text-xl"></i>
          <span>写真を撮影</span>
        </button>

        <!-- Explicit Stop Button -->
        <button id="stop-btn" class="w-full py-2.5 px-4 rounded-xl font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 hover:text-red-400 border border-slate-700/60 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-power-off"></i>
          <span>カメラを完全に停止</span>
        </button>
      </div>

      <!-- Information Card -->
      <div class="mt-auto p-4 rounded-xl bg-indigo-950/40 border border-indigo-900/50 text-xs text-indigo-300/80 leading-relaxed space-y-2">
        <p class="font-semibold text-indigo-300 flex items-center gap-1.5">
          <i class="fa-solid fa-shield-halved"></i>
          省電力とプレビュー非表示
        </p>
        <p>画面への <code>&lt;video&gt;</code> リアルタイム描画をカットしているため、GPUとバッテリーへの負荷を極力抑えて撮影を行います。</p>
      </div>
    </section>

    <!-- Canvas & Gallery Section -->
    <section class="w-full lg:w-2/3 flex flex-col gap-6">
      <!-- Main Canvas Viewport -->
      <div class="relative w-full aspect-video bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl flex items-center justify-center group">
        <!-- Empty Placeholder -->
        <div id="canvas-placeholder" class="flex flex-col items-center gap-3 text-slate-600 p-6 text-center">
          <i class="fa-regular fa-image text-4xl"></i>
          <p class="text-sm">撮影ボタンを押すとここにCanvas描画されます</p>
        </div>

        <!-- HTML5 Canvas for Capture display -->
        <canvas id="photo-canvas" class="hidden w-full h-full object-contain"></canvas>

        <!-- Download Floating Button -->
        <button id="download-btn" class="hidden absolute bottom-4 right-4 py-2.5 px-4 bg-slate-900/80 hover:bg-slate-900 text-white rounded-xl text-xs font-semibold backdrop-blur-md border border-slate-700 shadow-xl transition-all flex items-center gap-2">
          <i class="fa-solid fa-download"></i>
          <span>画像を保存</span>
        </button>
      </div>

      <!-- History Thumbnail Strip -->
      <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">撮影履歴</span>
          <span id="gallery-count" class="text-xs text-slate-500">0 枚</span>
        </div>
        
        <div id="gallery" class="flex gap-3 overflow-x-auto pb-2 scrollbar-thin scrollbar-thumb-slate-700 min-h-[76px] items-center">
          <p id="gallery-empty" class="text-xs text-slate-600 w-full text-center py-4">履歴はありません</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-4xl mt-8 pt-4 border-t border-slate-800 text-center text-xs text-slate-500">
    Webcam Canvas Shooter &copy; Built with MediaDevices API &amp; HTML5 Canvas
  </footer>

  <!-- Hidden Video Element for Stream Processing (display: none) -->
  <video id="hidden-video" autoplay playsinline class="hidden"></video>

  <!-- Notification Toast Container -->
  <div id="toast" class="fixed top-5 right-5 transform translate-y-[-150%] opacity-0 transition-all duration-300 bg-indigo-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-medium z-50">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toast-message">メッセージ</span>
  </div>

  <!-- JavaScript Implementation -->
  <script>
    // Global State
    let activeStream = null;
    let isContinuousMode = false;
    let capturedHistory = [];

    // DOM Elements
    const video = document.getElementById('hidden-video');
    const canvas = document.getElementById('photo-canvas');
    const ctx = canvas.getContext('2d');
    
    const snapBtn = document.getElementById('snap-btn');
    const stopBtn = document.getElementById('stop-btn');
    const modeToggle = document.getElementById('mode-toggle');
    const cameraSelect = document.getElementById('camera-select');
    const downloadBtn = document.getElementById('download-btn');
    
    const statusBadge = document.getElementById('status-badge');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const canvasPlaceholder = document.getElementById('canvas-placeholder');
    const gallery = document.getElementById('gallery');
    const galleryCount = document.getElementById('gallery-count');
    const galleryEmpty = document.getElementById('gallery-empty');

    // 1. Camera Control Functions
    async function startCamera() {
      // Clean up existing stream before starting a new one (especially when switching facingMode)
      if (activeStream) {
        stopCamera();
      }

      try {
        updateStatus('connecting', 'カメラ起動中...');
        
        const facingMode = cameraSelect.value || 'environment';
        
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 }, 
            height: { ideal: 1080 } 
          }
        });

        video.srcObject = activeStream;

        // Wait until stream Metadata is loaded
        await new Promise((resolve) => {
          video.onloadedmetadata = () => resolve();
        });

        await video.play();

        // Match canvas dimensions to actual video resolution
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        updateStatus('active', isContinuousMode ? '連写モード (待機中)' : 'カメラ動作中');
        stopBtn.disabled = false;
        return true;
      } catch (err) {
        console.error('Camera Access Error:', err);
        updateStatus('error', 'カメラ接続失敗');
        showToast('カメラへのアクセスが拒否されたか、利用できません。');
        stopCamera();
        return false;
      }
    }

    function stopCamera() {
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
        video.srcObject = null;
      }
      updateStatus('stopped', 'カメラ停止中');
    }

    // 2. Status Badge Manager
    function updateStatus(state, message) {
      statusText.textContent = message;

      // Reset classes
      statusBadge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium border transition-all duration-300 ";
      statusDot.className = "w-2.5 h-2.5 rounded-full transition-colors ";

      if (state === 'active') {
        statusBadge.classList.add('bg-emerald-950/60', 'text-emerald-300', 'border-emerald-700/60');
        statusDot.classList.add('bg-emerald-400', 'animate-pulse');
      } else if (state === 'connecting') {
        statusBadge.classList.add('bg-amber-950/60', 'text-amber-300', 'border-amber-700/60');
        statusDot.classList.add('bg-amber-400', 'animate-ping');
      } else if (state === 'error') {
        statusBadge.classList.add('bg-rose-950/60', 'text-rose-300', 'border-rose-700/60');
        statusDot.classList.add('bg-rose-500');
      } else {
        statusBadge.classList.add('bg-slate-800', 'text-slate-400', 'border-slate-700');
        statusDot.classList.add('bg-slate-500');
      }
    }

    // 3. Frame Capture Logic
    function captureFrame() {
      // Draw frame to canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Display Canvas & Download Button
      canvasPlaceholder.classList.add('hidden');
      canvas.classList.remove('hidden');
      downloadBtn.classList.remove('hidden');

      // Generate Data URL for History
      const dataUrl = canvas.toDataURL('image/png');
      addToGallery(dataUrl);

      showToast('写真を撮影しました！');
    }

    // 4. Shutter Event Handler
    snapBtn.addEventListener('click', async () => {
      snapBtn.disabled = true;
      snapBtn.classList.add('opacity-75');

      if (isContinuousMode) {
        // Continuous Mode: Stream is already open in background -> Instant Capture!
        if (!activeStream) {
          const ok = await startCamera();
          if (ok) captureFrame();
        } else {
          captureFrame();
        }
      } else {
        // Single Shot (Power Saver Mode): On-demand Start -> Capture -> Stop Immediately
        const ok = await startCamera();
        if (ok) {
          // Slight delay to ensure autofocus / exposure stabilization
          await new Promise(res => setTimeout(res, 200));
          captureFrame();
          stopCamera();
        }
      }

      snapBtn.disabled = false;
      snapBtn.classList.remove('opacity-75');
    });

    // 5. Continuous Mode Toggle Event Handler
    modeToggle.addEventListener('change', async (e) => {
      isContinuousMode = e.target.checked;

      if (isContinuousMode) {
        showToast('連写モード: バックグラウンドで即時撮影待機します');
        await startCamera();
      } else {
        showToast('単発省電力モード: 撮影時のみカメラを起動します');
        stopCamera();
      }
    });

    // 5.5 Camera Facing Selector Event Handler
    cameraSelect.addEventListener('change', async () => {
      showToast(`カメラを ${cameraSelect.options[cameraSelect.selectedIndex].text} に切り替えました`);
      if (isContinuousMode || activeStream) {
        await startCamera();
      }
    });

    // 6. Explicit Stop Button Event
    <!-- 8. Gallery Management -->
    function addToGallery(dataUrl) {
      capturedHistory.unshift(dataUrl);
      if (galleryEmpty) galleryEmpty.remove();

      galleryCount.textContent = `${capturedHistory.length} 枚`;

      // 履歴用ラッパー要素
      const itemWrapper = document.createElement('div');
      itemWrapper.className = 'relative group shrink-0';

      const img = document.createElement('img');
      img.src = dataUrl;
      img.className = 'w-16 h-12 object-cover rounded-lg border border-slate-700 hover:border-indigo-500 cursor-pointer transition-all hover:scale-105';
      
      // サムネイルクリックでメインCanvasに復元
      img.addEventListener('click', () => {
        const tempImg = new Image();
        tempImg.onload = () => {
          canvas.width = tempImg.width;
          canvas.height = tempImg.height;
          ctx.drawImage(tempImg, 0, 0);
          canvasPlaceholder.classList.add('hidden');
          canvas.classList.remove('hidden');
          downloadBtn.classList.remove('hidden');
        };
        tempImg.src = dataUrl;
      });

      // 個別ダウンロードボタン
      const dlBtn = document.createElement('button');
      dlBtn.className = 'absolute -top-1.5 -right-1.5 w-5 h-5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full text-[10px] flex items-center justify-center shadow-lg transition-all opacity-0 group-hover:opacity-100';
      dlBtn.innerHTML = '<i class="fa-solid fa-download"></i>';
      dlBtn.title = 'この写真をダウンロード';
      dlBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // サムネイルのクリックイベント（プレビュー復元）を発生させない
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `webcam-capture-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });

      itemWrapper.appendChild(img);
      itemWrapper.appendChild(dlBtn);
      gallery.prepend(itemWrapper);
    }

    // 9. Toast Notification Helper
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      
      toastMessage.textContent = msg;
      toast.classList.remove('translate-y-[-150%]', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-[-150%]', 'opacity-0');
      }, 3000);
    }
  </script>
</body>
</html>
