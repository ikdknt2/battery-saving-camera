<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webカメラ撮影ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- ZIP作成用ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    #hidden-video, #pip-video {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- ヘッダー -->
    <header class="border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <i class="fa-solid font-bold fa-camera text-indigo-400"></i>
        Webカメラ撮影ツール（高機能・省電力）
      </h1>
      <p class="text-sm text-slate-400 mt-1">
        画面描画負荷を完全にカットしたバックグラウンド処理に対応。解像度・倍率選択・タイマー連写が可能です。
      </p>
    </header>

    <!-- メイン操作カード -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- 設定＆コントローラー -->
      <section class="bg-slate-800 rounded-xl p-5 border border-slate-700 space-y-5">
        
        <!-- カメラ切替 -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">使用カメラ</label>
          <select id="camera-select" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="user">インカメラ（前面）</option>
            <option value="environment">アウトカメラ（背面）</option>
          </select>
        </div>

        <!-- 解像度切替 -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">撮影解像度</label>
          <select id="resolution-select" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="default">自動（端末標準）</option>
            <option value="3840x2160">最高画質 (4K: 3840x2160)</option>
            <option value="1920x1080">高画質 (Full HD: 1920x1080)</option>
            <option value="1280x720">標準画質 (HD: 1280x720)</option>
            <option value="640x480">省電力/低画質 (VGA: 640x480)</option>
          </select>
        </div>

        <!-- 倍率切替（ズーム） -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">撮影倍率 (ズーム)</label>
          <select id="zoom-select" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="0.6">0.6x (超広角)</option>
            <option value="1" selected>1x (等倍/標準)</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x (2倍ズーム)</option>
            <option value="3">3x (3倍ズーム)</option>
          </select>
        </div>

        <!-- 撮影モード -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">基本モード</label>
          <div class="flex items-center justify-between bg-slate-700/50 p-3 rounded-lg border border-slate-600">
            <span class="text-sm font-medium">連写モード（待機）</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="mode-toggle" class="sr-only peer">
              <div class="w-11 h-6 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            </label>
          </div>
          <p class="text-xs text-slate-400 mt-1.5" id="mode-desc">
            単発モード: 撮影時のみ起動（省電力）
          </p>
        </div>

        <!-- タイマー自動撮影設定 -->
        <div class="border-t border-slate-700 pt-4">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">タイマー自動連写</label>
          <div class="grid grid-cols-2 gap-3 mb-3">
            <div>
              <span class="text-xs text-slate-400">撮影間隔(秒)</span>
              <input type="number" id="timer-interval" min="0.5" step="0.5" value="2" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <span class="text-xs text-slate-400">撮影回数(回)</span>
              <input type="number" id="timer-count" min="1" step="1" value="5" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
          </div>
          
          <!-- PiP有効化チェックボックス -->
          <div class="flex items-center gap-2 mb-3 bg-slate-700/30 p-2 rounded border border-slate-700">
            <input type="checkbox" id="pip-toggle" class="w-4 h-4 text-indigo-600 rounded bg-slate-700 border-slate-600 focus:ring-indigo-500">
            <label for="pip-toggle" class="text-xs text-slate-300 cursor-pointer select-none">
              進捗をPiP（小窓）で表示する(PC推奨)
            </label>
          </div>

          <button id="timer-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg text-sm transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-clock"></i>
            <span>タイマー自動撮影を開始</span>
          </button>
        </div>

        <!-- 撮影操作ボタン -->
        <div class="space-y-2 border-t border-slate-700 pt-4">
          <button id="snap-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-camera"></i>
            <span>撮影する</span>
          </button>

          <button id="stop-btn" class="w-full bg-slate-700 hover:bg-rose-600 hover:text-white text-slate-300 font-medium py-2 px-4 rounded-lg text-sm transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-power-off"></i>
            <span>カメラを完全に停止</span>
          </button>
        </div>

        <!-- ステータス表示 -->
        <div id="status" class="text-xs text-center py-2 px-3 bg-slate-900/50 rounded-lg border border-slate-700/50 text-slate-400">
          カメラ停止中
        </div>

      </section>

      <!-- メイン表示領域 -->
      <section class="md:col-span-2 space-y-6">
        
        <!-- プレビュー／撮影画像メイン領域 -->
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
          <h2 class="text-sm font-semibold text-slate-400 mb-3 flex items-center justify-between">
            <span>プレビュー／最新撮影結果</span>
            <span id="canvas-size" class="text-xs font-normal text-slate-500"></span>
          </h2>

          <div class="relative bg-slate-950 rounded-lg overflow-hidden flex items-center justify-center min-h-[300px] border border-slate-900">
            <canvas id="photo-canvas" class="max-w-full h-auto max-h-[450px] block"></canvas>
            
            <div id="placeholder-text" class="absolute text-slate-600 text-center p-4">
              <i class="fa-solid fa-image text-4xl mb-2"></i>
              <p class="text-sm">撮影した写真がここに表示されます</p>
            </div>
          </div>
        </div>

        <!-- 撮影履歴ギャラリー -->
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <h2 class="text-sm font-semibold text-slate-400">撮影履歴</h2>
            
            <!-- 一括操作ボタン群 -->
            <div class="flex items-center gap-2 flex-wrap">
              <button id="select-all-btn" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded transition">
                全選択
              </button>
              <button id="deselect-all-btn" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded transition">
                解除
              </button>
              <button id="download-selected-btn" disabled class="text-xs bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white px-2.5 py-1 rounded transition flex items-center gap-1">
                <i class="fa-solid fa-file-zipper"></i>
                <span id="download-btn-text">選択項目をZIP保存</span>
              </button>
              <button id="delete-selected-btn" disabled class="text-xs bg-rose-700 hover:bg-rose-600 disabled:bg-slate-700 disabled:text-slate-500 text-white px-2.5 py-1 rounded transition flex items-center gap-1">
                <i class="fa-solid fa-trash"></i>
                <span>選択削除</span>
              </button>
            </div>
          </div>

          <div id="gallery" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 max-h-[260px] overflow-y-auto p-1 border-t border-slate-700/50 pt-3">
            <p id="empty-gallery-msg" class="col-span-full text-xs text-slate-600 text-center py-6">
              履歴はありません
            </p>
          </div>
        </div>

      </section>

    </main>
  </div>

  <!-- 非表示の画面更新なしvideo要素 -->
  <video id="hidden-video" autoplay playsinline></video>
  <!-- PiP再生用のビデオ要素 -->
  <video id="pip-video" autoplay playsinline muted></video>

  <script>
    const video = document.getElementById('hidden-video');
    const pipVideo = document.getElementById('pip-video');
    const canvas = document.getElementById('photo-canvas');
    const ctx = canvas.getContext('2d');
    
    const snapBtn = document.getElementById('snap-btn');
    const stopBtn = document.getElementById('stop-btn');
    const timerBtn = document.getElementById('timer-btn');
    const downloadSelectedBtn = document.getElementById('download-selected-btn');
    const deleteSelectedBtn = document.getElementById('delete-selected-btn');
    const selectAllBtn = document.getElementById('select-all-btn');
    const deselectAllBtn = document.getElementById('deselect-all-btn');
    const modeToggle = document.getElementById('mode-toggle');
    const pipToggle = document.getElementById('pip-toggle');
    const cameraSelect = document.getElementById('camera-select');
    const resolutionSelect = document.getElementById('resolution-select');
    const zoomSelect = document.getElementById('zoom-select');
    const statusText = document.getElementById('status');
    const modeDesc = document.getElementById('mode-desc');
    const placeholderText = document.getElementById('placeholder-text');
    const gallery = document.getElementById('gallery');
    const emptyGalleryMsg = document.getElementById('empty-gallery-msg');

    const defaultTitle = "Webカメラ撮影ツール";
    let activeStream = null;
    let isContinuousMode = false;
    let isTimerRunning = false;
    let historyCount = 0;
    
    // 画像データを保持する配列 (id, dataUrl, checked)
    let capturedImages = [];

    // --- PiP（画面隅の小窓進捗表示）用キャンバスの設定 ---
    const pipCanvas = document.createElement('canvas');
    pipCanvas.width = 320;
    pipCanvas.height = 180;
    const pipCtx = pipCanvas.getContext('2d');

    const pipStream = pipCanvas.captureStream(10);
    pipVideo.srcObject = pipStream;

    function updatePipStatus(current, total, isComplete = false) {
      pipCtx.fillStyle = '#0f172a';
      pipCtx.fillRect(0, 0, pipCanvas.width, pipCanvas.height);
      
      pipCtx.fillStyle = isComplete ? '#10b981' : '#38bdf8';
      pipCtx.font = 'bold 42px sans-serif';
      pipCtx.textAlign = 'center';
      pipCtx.textBaseline = 'middle';
      
      if (isComplete) {
        pipCtx.fillText('完了!', pipCanvas.width / 2, pipCanvas.height / 2 - 10);
      } else {
        pipCtx.fillText(`${current} / ${total}`, pipCanvas.width / 2, pipCanvas.height / 2 - 10);
      }

      pipCtx.fillStyle = '#94a3b8';
      pipCtx.font = '14px sans-serif';
      pipCtx.fillText(isComplete ? '全枚数の撮影が終わりました' : 'タイマー撮影実行中...', pipCanvas.width / 2, pipCanvas.height / 2 + 35);
    }

    async function startPip() {
      try {
        if (document.pictureInPictureElement !== pipVideo && document.pictureInPictureEnabled) {
          await pipVideo.play();
          await pipVideo.requestPictureInPicture();
        }
      } catch (err) {
        console.warn("PiPの起動に失敗しました:", err);
      }
    }

    async function stopPip() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        }
      } catch (err) {
        console.warn("PiPの終了エラー:", err);
      }
    }

    // --- ズーム（倍率）の設定適用 ---
    async function applyZoom(track, zoomValue) {
      if (!track) return;
      try {
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.zoom) {
          const targetZoom = Math.min(Math.max(zoomValue, capabilities.zoom.min), capabilities.zoom.max);
          await track.applyConstraints({ advanced: [{ zoom: targetZoom }] });
        }
      } catch (err) {
        console.warn("ズーム制限の適用に失敗しました:", err);
      }
    }

    // --- カメラの起動 ---
    async function startCamera() {
      if (activeStream) return activeStream;

      const facingMode = cameraSelect.value;
      const resValue = resolutionSelect.value;
      const zoomValue = parseFloat(zoomSelect.value) || 1;
      
      const videoConstraints = { facingMode: facingMode };

      if (resValue !== 'default') {
        const [w, h] = resValue.split('x').map(Number);
        videoConstraints.width = { ideal: w };
        videoConstraints.height = { ideal: h };
      }

      statusText.textContent = "カメラ起動中...";
      
      try {
        activeStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints });
        video.srcObject = activeStream;

        const videoTrack = activeStream.getVideoTracks()[0];
        await applyZoom(videoTrack, zoomValue);
        
        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            document.getElementById('canvas-size').textContent = `${video.videoWidth} x ${video.videoHeight}px`;
            resolve();
          };
        });

        await video.play();
        statusText.textContent = isContinuousMode ? "カメラ待機中（即時撮影可）" : "カメラ準備完了";
        return activeStream;
      } catch (err) {
        console.error("カメラの起動エラー:", err);
        statusText.textContent = "カメラ接続エラー";
        throw err;
      }
    }

    // --- 明示的なカメラ停止 ---
    function stopCamera() {
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
        video.srcObject = null;
        statusText.textContent = "カメラ停止中";
      }
    }

    // --- キャプチャ（撮影）実行 ---
    function capture() {
      if (!video.videoWidth) return null;

      placeholderText.style.display = 'none';
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/png');
      
      addToGallery(dataUrl);
      return dataUrl;
    }

    // --- ボタンの有効/無効・件数表示の更新 ---
    function updateSelectionControls() {
      const selectedCount = capturedImages.filter(item => item.checked).length;
      
      downloadSelectedBtn.disabled = selectedCount === 0;
      deleteSelectedBtn.disabled = selectedCount === 0;

      const downloadTextSpan = document.getElementById('download-btn-text');
      if (selectedCount > 0) {
        downloadTextSpan.textContent = `選択中の${selectedCount}枚をZIP保存`;
      } else {
        downloadTextSpan.textContent = "選択項目をZIP保存";
      }
    }

    // --- ギャラリーに写真追加 ---
    function addToGallery(dataUrl) {
      if (emptyGalleryMsg) {
        emptyGalleryMsg.style.display = 'none';
      }

      historyCount++;
      const id = historyCount;
      const itemObj = { id, dataUrl, checked: true }; // 初期状態はチェックON
      capturedImages.push(itemObj);

      const container = document.createElement('div');
      container.className = 'relative group aspect-video bg-slate-900 rounded border border-slate-700 overflow-hidden';
      container.dataset.id = id;

      // チェックボックス
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = true;
      checkbox.className = 'absolute top-1.5 left-1.5 z-10 w-4 h-4 text-indigo-600 rounded bg-slate-900/80 border-slate-500 focus:ring-indigo-500 cursor-pointer';
      checkbox.onchange = (e) => {
        itemObj.checked = e.target.checked;
        updateSelectionControls();
      };

      // サムネイル画像
      const img = document.createElement('img');
      img.src = dataUrl;
      img.className = 'w-full h-full object-cover cursor-pointer';
      img.title = `写真 #${id} を表示`;
      img.onclick = () => {
        const image = new Image();
        image.onload = () => {
          canvas.width = image.width;
          canvas.height = image.height;
          ctx.drawImage(image, 0, 0);
          placeholderText.style.display = 'none';
        };
        image.src = dataUrl;
      };

      // 個別ダウンロードボタン
      const dlBtn = document.createElement('a');
      dlBtn.href = dataUrl;
      dlBtn.download = `photo_${id}.png`;
      dlBtn.className = 'absolute top-1 right-1 bg-slate-900/80 hover:bg-emerald-600 text-white text-xs p-1.5 rounded transition opacity-80 group-hover:opacity-100 flex items-center justify-center';
      dlBtn.title = `写真 #${id} をダウンロード`;
      dlBtn.innerHTML = '<i class="fa-solid fa-download"></i>';

      container.appendChild(checkbox);
      container.appendChild(img);
      container.appendChild(dlBtn);
      gallery.insertBefore(container, gallery.firstChild);

      updateSelectionControls();
    }

    // --- 選択した写真のみZIP保存 ---
    async function downloadSelectedAsZip() {
      const selectedItems = capturedImages.filter(item => item.checked);
      if (selectedItems.length === 0) return;

      const originalHTML = downloadSelectedBtn.innerHTML;
      downloadSelectedBtn.disabled = true;
      downloadSelectedBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ZIP作成中...';

      try {
        const zip = new JSZip();

        selectedItems.forEach((item) => {
          const base64Data = item.dataUrl.replace(/^data:image\/png;base64,/, "");
          zip.file(`photo_${item.id}.png`, base64Data, { base64: true });
        });

        const content = await zip.generateAsync({ type: "blob" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `photos_selected_${Date.now()}.zip`;
        link.click();
        URL.revokeObjectURL(link.href);

      } catch (err) {
        console.error("ZIP生成エラー:", err);
        alert("ZIPファイルの作成に失敗しました。");
      } finally {
        downloadSelectedBtn.disabled = false;
        downloadSelectedBtn.innerHTML = originalHTML;
        updateSelectionControls();
      }
    }

    // --- 選択した写真を削除 ---
    function deleteSelected() {
      const selectedIds = capturedImages.filter(item => item.checked).map(item => item.id);
      if (selectedIds.length === 0) return;

      // メモリ配列から除外
      capturedImages = capturedImages.filter(item => !item.checked);

      // DOM要素から削除
      selectedIds.forEach(id => {
        const elem = gallery.querySelector(`[data-id="${id}"]`);
        if (elem) elem.remove();
      });

      if (capturedImages.length === 0) {
        emptyGalleryMsg.style.display = 'block';
      }

      updateSelectionControls();
    }

    // --- 全選択 / 全解除 ---
    function setAllCheckboxes(checkedState) {
      capturedImages.forEach(item => {
        item.checked = checkedState;
      });

      const checkboxes = gallery.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach(cb => {
        cb.checked = checkedState;
      });

      updateSelectionControls();
    }

    // --- タイマー自動連写機能 ---
    async function startTimerCapture() {
      if (isTimerRunning) return;

      const intervalSec = parseFloat(document.getElementById('timer-interval').value) || 2;
      const totalCount = parseInt(document.getElementById('timer-count').value, 10) || 5;
      const usePip = pipToggle.checked;

      isTimerRunning = true;
      timerBtn.disabled = true;
      snapBtn.disabled = true;

      try {
        await startCamera();

        if (usePip) {
          updatePipStatus(0, totalCount);
          await startPip();
        }

        for (let i = 1; i <= totalCount; i++) {
          if (!isTimerRunning) break;

          document.title = `(${i}/${totalCount}) 撮影中...`;
          statusText.textContent = `タイマー撮影中: ${i} / ${totalCount} 枚目`;
          capture();

          if (usePip) {
            updatePipStatus(i, totalCount);
          }

          if (i < totalCount) {
            await new Promise(resolve => setTimeout(resolve, intervalSec * 1000));
          }
        }

        if (usePip) {
          updatePipStatus(totalCount, totalCount, true);
        }
        
        document.title = "【完了】" + defaultTitle;
        statusText.textContent = `タイマー撮影完了 (${totalCount}枚)`;
        
        if (usePip) {
          await new Promise(resolve => setTimeout(resolve, 1500));
        }
      } catch (err) {
        console.error("タイマー撮影失敗:", err);
        document.title = defaultTitle;
      } finally {
        isTimerRunning = false;
        timerBtn.disabled = false;
        snapBtn.disabled = false;
        
        setTimeout(() => {
          document.title = defaultTitle;
        }, 3000);

        if (usePip) {
          await stopPip();
        }

        if (!isContinuousMode) {
          stopCamera();
        }
      }
    }

    // --- イベントリスナー ---

    snapBtn.addEventListener('click', async () => {
      if (isTimerRunning) return;

      try {
        if (isContinuousMode) {
          if (!activeStream) await startCamera();
          capture();
        } else {
          await startCamera();
          capture();
          stopCamera();
        }
      } catch (err) {
        alert("撮影に失敗しました。カメラの利用許可を確認してください。");
      }
    });

    modeToggle.addEventListener('change', async (e) => {
      isContinuousMode = e.target.checked;
      
      if (isContinuousMode) {
        modeDesc.textContent = "連写モード: カメラ常時待機（高速撮影）";
        await startCamera();
      } else {
        modeDesc.textContent = "単発モード: 撮影時のみ起動（省電力）";
        stopCamera();
      }
    });

    cameraSelect.addEventListener('change', async () => {
      if (activeStream || isContinuousMode) {
        stopCamera();
        await startCamera();
      }
    });

    resolutionSelect.addEventListener('change', async () => {
      if (activeStream || isContinuousMode) {
        stopCamera();
        await startCamera();
      }
    });

    zoomSelect.addEventListener('change', async () => {
      const zoomValue = parseFloat(zoomSelect.value) || 1;
      if (activeStream) {
        const videoTrack = activeStream.getVideoTracks()[0];
        await applyZoom(videoTrack, zoomValue);
      } else if (isContinuousMode) {
        await startCamera();
      }
    });

    stopBtn.addEventListener('click', () => {
      isTimerRunning = false;
      document.title = defaultTitle;
      stopCamera();
      stopPip();
    });

    timerBtn.addEventListener('click', () => {
      startTimerCapture();
    });

    downloadSelectedBtn.addEventListener('click', () => {
      downloadSelectedAsZip();
    });

    deleteSelectedBtn.addEventListener('click', () => {
      deleteSelected();
    });

    selectAllBtn.addEventListener('click', () => {
      setAllCheckboxes(true);
    });

    deselectAllBtn.addEventListener('click', () => {
      setAllCheckboxes(false);
    });
  </script>
</body>
</html>
